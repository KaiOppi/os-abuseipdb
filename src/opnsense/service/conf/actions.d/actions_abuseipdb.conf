[download]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/download_blacklist.py
parameters:
type:script_output
message:Download AbuseIPDB blacklist
description:Download and refresh the AbuseIPDB blacklist

[testconnection]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/test_connection.py
parameters:
type:script_output
message:Test AbuseIPDB API connection
description:Verify API key and connectivity

[stats]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/stats.py
parameters:
type:script_output
message:Return AbuseIPDB stats as JSON
description:Aggregated blocks / reports / quota

[report]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/reporter.py
parameters:
type:script_output
message:Run one reporter iteration
description:Parse firewall log and submit pending reports

[setup]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/setup.sh
parameters:
type:script_output
message:Setup AbuseIPDB firewall alias + block rule
description:Create/update alias and block rule when plugin is enabled

[suricata]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/suricata_report.py
parameters:
type:script_output
message:Run one Suricata reporter iteration
description:Parse the Suricata EVE log and submit qualifying attacker IPs

[prefix_aggregate]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/prefix_aggregate.py
parameters:
type:script_output
message:Run one prefix-aggregation scan
description:Aggregate self-defense hits into prefix-level blocks (issue #8)

[reports]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/reports.py
parameters:%s
type:script_output
message:List recent AbuseIPDB reports
description:Return up to N most recent reports as JSON

[selfcare_cleanup]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/selfcare_cleanup.py
parameters:
type:script_output
message:Expire self-defense blocklist entries
description:Remove IPs whose TTL has passed from the self-defense pf table

[selfcare_list]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/selfcare_list.py
parameters:%s
type:script_output
message:List active self-defense entries
description:Return the current self-defense block list as JSON

[permaban_list]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/permaban_list.py
parameters:%s
type:script_output
message:List Perma-Block entries
description:Return the current Perma-Block list as JSON

[permaban_add]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/permaban_add.py
parameters:%s %s %s
type:script_output
message:Add IP to Perma-Block list
description:Permanently block an IP (no AbuseIPDB report submitted)

[permaban_remove]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/permaban_remove.py
parameters:%s
type:script_output
message:Remove IP from Perma-Block list
description:Lift a Perma-Block entry and reset its history counter

[permaban_scan]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/permaban_promote.py
parameters:
type:script_output
message:Auto-promote scan
description:Promote IPs that crossed the Self-Defense recurrence threshold

[permaban_count]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/permaban_count.py
parameters:
type:script_output
message:Sample pf counters for Perma-Block IPs
description:Persist per-IP hit counts for the Perma-Block table across reboots

[selfcare_remove]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/selfcare_remove.py
parameters:%s %s
type:script_output
message:Remove IP from self-defense list
description:Remove a single IP (or all entries with "all yes") from self-defense

[whitelist_add]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/whitelist_add.py
parameters:%s %s %s
type:script_output
message:Add IP to operator whitelist
description:Whitelist an IP — lifts existing selfcare + permaban entries

[whitelist_remove]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/whitelist_remove.py
parameters:%s
type:script_output
message:Remove IP from operator whitelist
description:Drop a whitelist entry

[whitelist_list]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/whitelist_list.py
parameters:%s
type:script_output
message:List whitelist entries
description:Return whitelist entries (with per-IP 30d skip counter) as JSON
