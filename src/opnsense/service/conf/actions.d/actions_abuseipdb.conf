[download]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/download_blacklist.py
parameters:
type:script_output
message:Download AbuseIPDB blacklist
description:Download and refresh the AbuseIPDB blacklist

[testconnection]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/test_connection.py
parameters:
type:script_output
message:Test AbuseIPDB API connection
description:Verify API key and connectivity

[stats]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/stats.py
parameters:
type:script_output
message:Return AbuseIPDB stats as JSON
description:Aggregated blocks / reports / quota

[report]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/reporter.py
parameters:
type:script_output
message:Run one reporter iteration
description:Parse firewall log and submit pending reports

[setup]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/setup.sh
parameters:
type:script_output
message:Setup AbuseIPDB firewall alias + block rule
description:Create/update alias and block rule when plugin is enabled
