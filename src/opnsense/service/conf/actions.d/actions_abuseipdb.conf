[download]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/download_blacklist.py
parameters:
type:script_output
message:Download AbuseIPDB blacklist
description:Download and refresh the AbuseIPDB blacklist

[testconnection]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/test_connection.py
parameters:
type:script_output
message:Test AbuseIPDB API connection
description:Verify API key and connectivity

[stats]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/stats.py
parameters:
type:script_output
message:Return AbuseIPDB stats as JSON
description:Aggregated blocks / reports / quota

[report]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/reporter.py
parameters:
type:script_output
message:Run one reporter iteration
description:Parse firewall log and submit pending reports

[setup]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/setup.sh
parameters:
type:script_output
message:Setup AbuseIPDB firewall alias + block rule
description:Create/update alias and block rule when plugin is enabled

[reports]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/reports.py
parameters:%s
type:script_output
message:List recent AbuseIPDB reports
description:Return up to N most recent reports as JSON

[selfcare_cleanup]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/selfcare_cleanup.py
parameters:
type:script_output
message:Expire self-defense blocklist entries
description:Remove IPs whose TTL has passed from the self-defense pf table

[selfcare_list]
command:/usr/local/opnsense/scripts/OPNsense/Abuseipdb/selfcare_list.py
parameters:%s
type:script_output
message:List active self-defense entries
description:Return the current self-defense block list as JSON
